<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks · Productivity Islands</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="tasks"><div class="shell">
<header class="appbar"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Productivity Islands</a><nav class="nav" aria-label="Primary navigation"><a href="index.html">Islands</a><a href="city.html">Main Island</a><a href="tasks.html">Tasks</a><a href="calendar.html">Calendar</a><a href="focus.html">Focus</a><a href="habits.html">Habits</a><a href="notes.html">Notes</a></nav><div class="resources"><span class="resource">Level <b data-level></b></span><span class="resource">Coins <b data-coins></b></span></div><button class="mobile-menu" aria-label="Open navigation">Menu</button></header>
<main class="page island-page"><div class="page-head"><div><div class="island-breadcrumb"><span>Quest Board Isle</span></div><h1>Quest ledger</h1><p>Choose the work that moves your island forward.</p></div><div class="actions"><a class="btn" href="index.html">Back to islands</a><button class="btn primary" data-new-task>New quest</button></div></div><section class="card quest-panel"><div class="card-head"><div><h2>Open commissions</h2><span class="muted small"><b data-task-count>0</b> open</span></div></div><div class="toolbar"><input id="task-search" type="search" placeholder="Search quests"><select id="task-filter"><option value="all">All quests</option><option value="open">Open</option><option value="completed">Completed</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div><div id="task-list"></div></section></main></div>
<div class="modal" id="task-modal"><div class="dialog quest-dialog"><div class="dialog-kicker">Quest Board</div><h2>Quest details</h2><form class="form" id="task-form"><div class="field wide"><label for="task-title">Title</label><input id="task-title" required maxlength="120"></div><div class="field wide"><label for="task-description">Description</label><textarea id="task-description" rows="3"></textarea></div><div class="field"><label for="task-priority">Priority</label><select id="task-priority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="field"><label for="task-category">Category</label><input id="task-category" value="General"></div><div class="field"><label for="task-date">Due date</label><input id="task-date" type="date"></div><div class="form-actions"><button type="button" class="btn danger edit-delete" id="task-delete">Delete quest</button><span class="form-spacer"></span><button type="button" class="btn" id="task-cancel">Cancel</button><button class="btn primary">Save quest</button></div></form></div></div>
<script src="app.js"></script></body></html>
