    function migrate(){
      if(state.cityVersion>=3)return;
      const shift=state.cityVersion<2?{x:4,y:5}:{x:0,y:0},used=new Set();
      state.cityBuildings.forEach(b=>{b.col=(b.col||1)+shift.x;b.row=(b.row||1)+shift.y;b.w=b.w||catalogue[b.type]?.w||1;b.h=b.h||catalogue[b.type]?.h||1;b.level??=1;b.rotation??=0;let found=findSpace(b.col,b.row,b.w,b.h,used);b.col=found.col;b.row=found.row;cellsFor(b.col,b.row,b.w,b.h).forEach(c=>used.add(c))});
      state.cityVersion=3;Store.save();
    }
    function cellsFor(col,row,w,h){const out=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)out.push(`${col+x},${row+y}`);return out}
    function occupied(skip){const set=new Set();state.cityBuildings.filter(b=>b.id!==skip).forEach(b=>cellsFor(b.col,b.row,b.w,b.h).forEach(c=>set.add(c)));return set}
    function placement(col,row,w,h,skip){
      if(col<1||row<1||col+w-1>COLS||row+h-1>ROWS)return{ok:false,reason:'Outside buildable land'};
      const cells=cellsFor(col,row,w,h),used=occupied(skip);
      if(cells.some(c=>{const[a,b]=c.split(',').map(Number);return terrain(a,b)!=='land'}))return{ok:false,reason:'Blocked by coastline'};
      if(cells.some(c=>used.has(c)))return{ok:false,reason:'Occupied'};
      return{ok:true,reason:'Valid placement'};
    }
    function findSpace(col,row,w,h,extraUsed=new Set()){for(let radius=0;radius<30;radius++)for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++){if(Math.abs(x-col)+Math.abs(y-row)>radius||x+w-1>COLS||y+h-1>ROWS)continue;const cells=cellsFor(x,y,w,h);if(cells.every(c=>{const[a,b]=c.split(',').map(Number);return terrain(a,b)==='land'&&!extraUsed.has(c)}))return{col:x,row:y}}return{col:Math.max(2,Math.min(COLS-w,col)),row:Math.max(2,Math.min(ROWS-h,row))}}
    function snapshot(){undoStack.push(JSON.stringify({objects:state.cityBuildings,terrain:state.cityTerrain,coins:state.profile.coins}));if(undoStack.length>30)undoStack.shift();redoStack=[]}
    function restore(raw){const s=JSON.parse(raw);state.cityBuildings=s.objects;state.cityTerrain=s.terrain;state.profile.coins=s.coins;Store.save();render()}
    function doUndo(){if(!undoStack.length)return UI.toast('Nothing to undo');redoStack.push(JSON.stringify({objects:state.cityBuildings,terrain:state.cityTerrain,coins:state.profile.coins}));restore(undoStack.pop())}
    function doRedo(){if(!redoStack.length)return UI.toast('Nothing to redo');undoStack.push(JSON.stringify({objects:state.cityBuildings,terrain:state.cityTerrain,coins:state.profile.coins}));restore(redoStack.pop())}
    function roadMask(b){const at=(c,r)=>state.cityBuildings.some(x=>x.type==='road'&&x.col===c&&x.row===r);return{n:at(b.col,b.row-1),e:at(b.col+1,b.row),s:at(b.col,b.row+1),w:at(b.col-1,b.row)}}
    function renderRoadArms(b){const mask=roadMask(b);return Object.entries(mask).filter(([,v])=>v).map(([k])=>`<i class="road-arm ${k}"></i>`).join('')}
    function render(){
      grid.innerHTML='';
      const used=occupied();
      for(let row=1;row<=ROWS;row++)for(let col=1;col<=COLS;col++){const kind=terrain(col,row);if(kind==='water')continue;const p=point(col,row),tile=document.createElement('button'),variant=state.cityTerrain[`${col},${row}`]||0;tile.className=`tile ${kind} ${(col+row)%3===0?'alt':(col*row)%5===0?'alt2':''} terrain-${variant} ${kind==='coast'?['n','e','s','w'][(col+row)%4]:''}`;tile.dataset.col=col;tile.dataset.row=row;tile.style.left=(p.x-TW/2)+'px';tile.style.top=p.y+'px';tile.style.zIndex=col+row;tile.setAttribute('aria-label',kind==='land'?`Buildable tile ${col}, ${row}`:`Coastline tile ${col}, ${row}`);if(used.has(`${col},${row}`))tile.classList.add('occupied');grid.append(tile)}
      state.cityBuildings.forEach(b=>{const item=catalogue[b.type];if(!item)return;const center=point(b.col+(b.w-1)/2,b.row+(b.h-1)/2),el=document.createElement('button');el.className=`placed ${item.kind} ${b.type} variant-${b.variant||0}`;el.dataset.id=b.id;el.style.zIndex=100+b.col+b.row+b.h;el.setAttribute('aria-label',item.name);if(item.kind==='road'){const anchor=point(b.col,b.row);el.style.left=(anchor.x-TW/2)+'px';el.style.top=anchor.y+'px';el.innerHTML=renderRoadArms(b)}else{el.style.left=center.x+'px';el.style.top=(center.y+TH)+'px';el.style.width=Math.max(24,(b.w+b.h)*17)+'px'}grid.append(el)});
      updatePopulation();syncCitizens();Store.save();renderShell();showPreview(previewAnchor);showInspector(state.cityBuildings.find(x=>x.id===selectedObject)||null);
    }
    function updatePopulation(){const pop=18+state.cityBuildings.reduce((n,b)=>n+(catalogue[b.type]?.pop||0),0);state.profile.population=pop;document.getElementById('population').textContent=pop;document.getElementById('popbar').style.width=Math.min(100,pop/2)+'%'}
    function syncCitizens(){const layer=document.getElementById('citizens'),target=Math.max(2,Math.min(8,Math.floor(state.profile.population/8))),names=['Mara','Tomas','Elin','Rafi','Nora','Ivo','Sela','Oren'];while(layer.children.length>target)layer.lastElementChild.remove();while(layer.children.length<target){const i=layer.children.length,p=document.createElement('button');p.className='citizen';p.dataset.person=names[i];p.setAttribute('aria-label',names[i]);p.style.animationDelay=`${-i*8}s`;layer.append(p)}}
    function showInspector(obj){const panel=document.getElementById('inspector');if(!obj){panel.classList.remove('open');return}const item=catalogue[obj.type];document.getElementById('inspector-preview').textContent=(item.name[0]||'B').toUpperCase();document.getElementById('inspector-name').textContent=item.name;document.getElementById('inspector-meta').textContent=`${item.category} - Level ${obj.level||1} - ${obj.w}x${obj.h} - ${item.effect}`;panel.classList.add('open')}
    function currentFootprint(){if(!tool)return null;const item=catalogue[tool],rot=rotation%2&&item.w!==item.h;return{item,w:rot?item.h:item.w,h:rot?item.w:item.h}}
    function clearPreview(){grid.querySelectorAll('.preview-valid,.preview-invalid').forEach(x=>x.classList.remove('preview-valid','preview-invalid'))}
    function showPreview(anchor){clearPreview();previewAnchor=anchor;if(!anchor||!tool)return;const f=currentFootprint(),result=placement(anchor.col,anchor.row,f.w,f.h,moveId);cellsFor(anchor.col,anchor.row,f.w,f.h).forEach(c=>{const[col,row]=c.split(',');grid.querySelector(`.tile[data-col="${col}"][data-row="${row}"]`)?.classList.add(result.ok?'preview-valid':'preview-invalid')});document.getElementById('tool-status').textContent=`${result.reason} - ${f.w}x${f.h} - ${f.item.cost?f.item.cost+' coins':'free'}`}
    function selectTool(type){const item=catalogue[type];if(!item||state.profile.level<item.level)return UI.toast(`Unlocks at level ${item.level}`);tool=type;rotation=0;moveId=null;duplicateSource=null;document.getElementById('mode-pill').textContent='Build';renderCatalogue();document.getElementById('tool-status').textContent=`${item.name} - ${item.w}x${item.h} - ${item.cost?item.cost+' coins':'free'}`}
    function cancelTool(){tool=null;moveId=null;duplicateSource=null;rotation=0;previewAnchor=null;clearPreview();document.getElementById('mode-pill').textContent='Explore';renderCatalogue();document.getElementById('tool-status').textContent='Tool cancelled'}
    function placeAt(col,row,paint=false){if(!tool)return;const f=currentFootprint(),check=placement(col,row,f.w,f.h,moveId);if(!check.ok){if(!paint)UI.toast(check.reason);return}const cost=moveId?0:f.item.cost;if(state.profile.coins<cost){UI.toast('Not enough coins');return}snapshot();state.profile.coins-=cost;if(moveId){const b=state.cityBuildings.find(x=>x.id===moveId);Object.assign(b,{col,row,w:f.w,h:f.h,rotation});moveId=null;tool=null}else state.cityBuildings.push({id:crypto.randomUUID(),type:tool,col,row,w:f.w,h:f.h,rotation,level:1,variant:duplicateSource?.variant||0});render()}
    function removeObject(id){const b=state.cityBuildings.find(x=>x.id===id);if(!b)return;const item=catalogue[b.type],refund=Math.floor(item.cost*.4);if(item.kind==='building'&&!confirm(`Demolish ${item.name}? Refund: ${refund} coins.`))return;snapshot();state.cityBuildings=state.cityBuildings.filter(x=>x.id!==id);state.profile.coins+=refund;selectedObject=null;showInspector(null);closeMenu();render();UI.toast(`Removed${refund?' - '+refund+' coins refunded':''}`)}
    function renderCategories(){const cats=['All',...new Set(Object.values(catalogue).map(x=>x.category))];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="category ${c===activeCategory?'active':''}" data-category="${c}">${c}</button>`).join('')}
    function renderCatalogue(){const q=document.getElementById('catalogue-search').value.toLowerCase();document.getElementById('catalogue').innerHTML=Object.entries(catalogue).filter(([,v])=>(activeCategory==='All'||v.category===activeCategory)&&v.name.toLowerCase().includes(q)).map(([key,v])=>`<button class="building-card ${tool===key?'active':''} ${state.profile.level<v.level?'locked':''}" data-build="${key}"><b>${v.name}</b><small>${v.w}x${v.h} - ${v.cost?v.cost+' coins':'free'} - L${v.level}</small></button>`).join('')}
    function openMenu(e,target){e.preventDefault();closeMenu();let html='',kind='coast',col,row,obj;if(target.closest('.placed')){obj=state.cityBuildings.find(x=>x.id===target.closest('.placed').dataset.id);kind=catalogue[obj.type].kind;col=obj.col;row=obj.row;selectedObject=obj.id;showInspector(obj);cellsFor(obj.col,obj.row,obj.w,obj.h).forEach(c=>{const[a,b]=c.split(',');grid.querySelector(`.tile[data-col="${a}"][data-row="${b}"]`)?.classList.add('selected-tile')})}else{const tile=target.closest('.tile');if(!tile)return;col=+tile.dataset.col;row=+tile.dataset.row;kind=terrain(col,row);tile.classList.add('selected-tile')}
      if(kind==='coast')html=`<div class="context-title">Coastline</div><div class="context-meta">Tile ${col}, ${row} - not buildable</div><button data-cmd="inspect">Inspect terrain</button><button disabled>Coastline terrain - not buildable</button>`;
      else if(kind==='land')html=`<div class="context-title">Buildable tile</div><div class="context-meta">Tile ${col}, ${row}</div><button data-cmd="build">Build here</button><button data-cmd="road">Build road</button><button data-cmd="decorate">Add decoration</button><button data-cmd="inspect">Inspect tile</button><button data-cmd="terrain">Change terrain</button><button data-cmd="copy">Copy coordinates</button>`;
      else if(kind==='road')html=`<div class="context-title">Stone road</div><div class="context-meta">1x1 road tile</div><button data-cmd="properties">Road properties</button><button data-cmd="roadtype">Change road type</button><button data-cmd="upgrade">Upgrade road</button><button data-cmd="extend">Extend road</button><button data-cmd="replace">Replace road</button><button data-cmd="move">Move road</button><button class="danger" data-cmd="remove">Remove road</button>`;
      else if(kind==='decoration')html=`<div class="context-title">${catalogue[obj.type].name}</div><div class="context-meta">Decoration - ${obj.w}x${obj.h}</div><button data-cmd="properties">Properties</button><button data-cmd="move">Move</button><button data-cmd="rotate">Rotate</button><button data-cmd="duplicate">Duplicate</button><button data-cmd="replace">Replace</button><button class="danger" data-cmd="remove">Remove</button>`;
      else{const item=catalogue[obj.type];html=`<div class="context-title">${item.name}</div><div class="context-meta">${item.category} - Level ${obj.level||1} - ${obj.w}x${obj.h}<br>${item.effect}</div><button data-cmd="upgrade">Upgrade</button><button data-cmd="move">Move</button><button data-cmd="rotate">Rotate</button><button data-cmd="duplicate">Duplicate</button><button data-cmd="appearance">Change appearance</button><button data-cmd="store">Store in inventory</button><button class="danger" data-cmd="remove">Demolish</button>`}
      menu.innerHTML=html;menu.dataset.kind=kind;menu.dataset.col=col;menu.dataset.row=row;menu.dataset.id=obj?.id||'';menu.classList.add('open');const rect=menu.getBoundingClientRect(),x=Math.min(e.clientX,innerWidth-rect.width-8),y=Math.min(e.clientY,innerHeight-rect.height-8);menu.style.left=Math.max(8,x)+'px';menu.style.top=Math.max(8,y)+'px';menu.querySelector('button:not(:disabled)')?.focus()}
    function closeMenu(){menu.classList.remove('open');grid.querySelectorAll('.selected-tile').forEach(x=>x.classList.remove('selected-tile'))}
    function menuCommand(cmd){const col=+menu.dataset.col,row=+menu.dataset.row,id=menu.dataset.id,obj=state.cityBuildings.find(x=>x.id===id),item=obj&&catalogue[obj.type];if(cmd==='build'){selectTool('home');placeAt(col,row)}if(cmd==='road'){selectTool('road');placeAt(col,row)}if(cmd==='decorate'){selectTool('tree');placeAt(col,row)}if(cmd==='inspect'||cmd==='properties')UI.toast(`Tile ${col}, ${row} - ${terrain(col,row)}`);if(cmd==='copy')navigator.clipboard?.writeText(`${col},${row}`).then(()=>UI.toast('Coordinates copied'));if(cmd==='terrain'){snapshot();state.cityTerrain[`${col},${row}`]=((state.cityTerrain[`${col},${row}`]||0)+1)%3;render()}if(cmd==='remove')removeObject(id);if(cmd==='move'&&obj){tool=obj.type;rotation=obj.rotation||0;moveId=obj.id;document.getElementById('mode-pill').textContent='Move';closeMenu();renderCatalogue();UI.toast('Choose a new tile')}if(cmd==='rotate'&&obj){const check=placement(obj.col,obj.row,obj.h,obj.w,obj.id);if(!check.ok)return UI.toast(check.reason);snapshot();[obj.w,obj.h]=[obj.h,obj.w];obj.rotation=(obj.rotation+1)%4;render()}if(cmd==='duplicate'&&obj){selectTool(obj.type);duplicateSource=obj;closeMenu();UI.toast('Choose a tile for the duplicate')}if(cmd==='appearance'&&obj){snapshot();obj.variant=((obj.variant||0)+1)%3;render()}if(cmd==='upgrade'&&obj){const cost=5*(obj.level||1);if(state.profile.coins<cost)return UI.toast('Not enough coins');snapshot();state.profile.coins-=cost;obj.level=(obj.level||1)+1;render()}if(cmd==='store'&&obj){snapshot();state.cityInventory.push({...obj});state.cityBuildings=state.cityBuildings.filter(x=>x.id!==id);selectedObject=null;showInspector(null);render();UI.toast('Stored in inventory')}if(cmd==='extend'){selectTool('road');closeMenu();UI.toast('Paint connected road tiles')}if(cmd==='roadtype'&&obj){snapshot();obj.variant=((obj.variant||0)+1)%3;render()}if(cmd==='replace'&&obj){const replacement=item.kind==='road'?'road':'tree';removeObject(id);selectTool(replacement)}closeMenu()}
    function applyCamera(){cameraState.x=Math.max(-470,Math.min(470,cameraState.x));cameraState.y=Math.max(-320,Math.min(320,cameraState.y));camera.style.transform=`translate(calc(-50% + ${cameraState.x}px),calc(-50% + ${cameraState.y}px)) scale(${cameraState.zoom})`}
    migrate();renderCategories();renderCatalogue();render();applyCamera();
    document.getElementById('catalogue').onclick=e=>{const b=e.target.closest('[data-build]');if(b)selectTool(b.dataset.build)};
    document.getElementById('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){activeCategory=b.dataset.category;renderCategories();renderCatalogue()}};
    document.getElementById('catalogue-search').oninput=renderCatalogue;document.getElementById('collapse-panel').onclick=()=>document.getElementById('build-panel').classList.toggle('collapsed');
    document.getElementById('undo').onclick=doUndo;document.getElementById('redo').onclick=doRedo;document.getElementById('cancel-tool').onclick=cancelTool;
    grid.onpointerover=e=>{const tile=e.target.closest('.tile');if(tile&&tool){showPreview({col:+tile.dataset.col,row:+tile.dataset.row});if(roadPainting&&tool==='road')placeAt(+tile.dataset.col,+tile.dataset.row,true)}};
    grid.onpointerdown=e=>{const tile=e.target.closest('.tile');if(tile&&tool==='road'&&e.button===0){roadPainting=true;placeAt(+tile.dataset.col,+tile.dataset.row,true)}};
    addEventListener('pointerup',()=>roadPainting=false);
    grid.onclick=e=>{const obj=e.target.closest('.placed');if(obj){selectedObject=obj.dataset.id;grid.querySelectorAll('.placed').forEach(x=>x.classList.toggle('selected',x===obj));showInspector(state.cityBuildings.find(x=>x.id===selectedObject));return}const tile=e.target.closest('.tile');if(tile&&tool&&tool!=='road')placeAt(+tile.dataset.col,+tile.dataset.row)};
    grid.oncontextmenu=e=>openMenu(e,e.target);menu.onclick=e=>{const b=e.target.closest('[data-cmd]');if(b)menuCommand(b.dataset.cmd)};
    document.getElementById('inspector').onclick=e=>{const b=e.target.closest('[data-inspect-cmd]'),obj=state.cityBuildings.find(x=>x.id===selectedObject);if(!b||!obj)return;menu.dataset.id=obj.id;menu.dataset.col=obj.col;menu.dataset.row=obj.row;menuCommand(b.dataset.inspectCmd)};
    menu.onkeydown=e=>{const buttons=[...menu.querySelectorAll('button:not(:disabled)')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();buttons[(i+1)%buttons.length]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();buttons[(i-1+buttons.length)%buttons.length]?.focus()}};
    document.addEventListener('click',e=>{if(!e.target.closest('.context-menu'))closeMenu()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();cancelTool()}if(e.key.toLowerCase()==='r'&&tool){rotation=(rotation+1)%4;showPreview(previewAnchor)}if((e.key==='Delete'||e.key==='Backspace')&&selectedObject)removeObject(selectedObject);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}});
    document.getElementById('zoom-in').onclick=()=>{cameraState.zoom=Math.min(1.5,cameraState.zoom+.1);applyCamera()};document.getElementById('zoom-out').onclick=()=>{cameraState.zoom=Math.max(.55,cameraState.zoom-.1);applyCamera()};document.getElementById('camera-home').onclick=()=>{cameraState={x:0,y:0,zoom:.88};applyCamera()};
    viewport.onwheel=e=>{e.preventDefault();cameraState.zoom=Math.max(.55,Math.min(1.5,cameraState.zoom+(e.deltaY<0?.08:-.08)));applyCamera()};
    viewport.onpointerdown=e=>{if(e.button===1||e.target===viewport||e.target===camera||(!tool&&e.button===0&&!e.target.closest('.placed'))){panning=true;panStart={x:e.clientX-cameraState.x,y:e.clientY-cameraState.y};viewport.classList.add('panning')}};
    viewport.onpointermove=e=>{if(panning){cameraState.x=e.clientX-panStart.x;cameraState.y=e.clientY-panStart.y;applyCamera()}};viewport.onpointerup=()=>{panning=false;viewport.classList.remove('panning')};
    document.getElementById('citizens').onclick=e=>{const p=e.target.closest('[data-person]');if(p)UI.toast(p.dataset.person)};
  });
  </script>
</body>
